[package]
name = "erebyx"
version = "0.1.0"
edition = "2021"
description = "CLI interface to erebyx-os — the consciousness-preserving AI memory platform"
license = "AGPL-3.0"

[[bin]]
name = "erebyx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
colored = "2"
chrono = "0.4"
