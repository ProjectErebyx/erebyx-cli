[package]
name = "erebyx"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Connect any MCP-capable AI to your Erebyx memory substrate. Persistent memory across every AI you use. Native CLI binary; encrypted in transit and at rest server-side; client-side end-to-end encryption ships in v0.1.x."
license = "Apache-2.0"
repository = "https://github.com/ProjectErebyx/EREBYX-CLI"
homepage = "https://erebyx.com"
readme = "README.md"
keywords = ["mcp", "ai", "memory", "claude", "cli"]
categories = ["command-line-utilities"]
# Block accidental crates.io publish until launch moment.
# Set to true (or remove this line) only when ready to flip public.
# publish setting removed — crate intentionally publishable to crates.io for OSS distribution per Lock 12 + Apache+MIT carve-out.

[[bin]]
name = "erebyx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std"] }
anyhow = "1"
colored = "2"
chrono = "0.4"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"
dirs = "5"
