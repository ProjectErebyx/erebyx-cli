[package]
name = "erebyx"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
description = "Connect any MCP-capable AI to your EREBYX memory substrate. Persistent memory across every AI you use. Native CLI binary; encrypted in transit (TLS 1.3) and at rest with envelope encryption (server-held master KEK at v0.1.1); per-user zero-knowledge encryption in v0.2."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ProjectEREBYX/erebyx-cli"
homepage = "https://erebyx.com"
readme = "README.md"
keywords = ["mcp", "ai", "memory", "claude", "cli"]
categories = ["command-line-utilities"]
# CLI v0.1.2 fix [16]: explicit allowlist instead of `exclude`. An
# exclude-only list silently auto-ships any future stray file dropped into
# the crate root; an include list ships exactly these and nothing else.
include = [
    "src/**",
    "examples/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-*",
    "NOTICE",
    "SECURITY.md",
]

[[bin]]
name = "erebyx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std"] }
anyhow = "1"
colored = "2"
# CLI v0.1.2 fix [14]: only Password + Confirm are used. The default
# feature set pulls `fuzzy-matcher` (for fuzzy-select, which we never use).
# Trim to `password` + default-features=false; Confirm is always available.
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
indicatif = "0.18"
dirs = "5"

[dev-dependencies]
# tempfile = filesystem fixtures for is_within_git_tree tests.
# wiremock = HTTP mock for health_anonymous + integration smoke.
# serial_test = env-var-mutation tests must run sequentially.
tempfile = "3"
wiremock = "0.6"
serial_test = "3"
