[package]
name = "erebyx"
version = "0.1.0"
edition = "2021"
description = "CLI for erebyx-os — persistent, encrypted AI memory across every coding tool"
license = "AGPL-3.0"

[[bin]]
name = "erebyx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
colored = "2"
chrono = "0.4"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"
dirs = "5"
