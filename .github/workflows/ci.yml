# Continuous-integration checks for the `erebyx` CLI crate (public OSS).
#
# Trigger: every push to `main` and every pull request. This runs entirely on
# GitHub-hosted runners (`ubuntu-latest`) so that external contributors — whose
# forks/PRs have no access to self-hosted infrastructure or repo secrets — get
# full fmt + clippy + test feedback. No secrets are referenced, so this is safe
# to run on PRs from forks.
#
# The heavier release path (cross-platform binaries + crates.io publish) lives
# in `release.yml` and runs only on `v*` tags / manual dispatch.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save runner minutes; a CI run
# is idempotent and safe to interrupt (unlike the release publish).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  # CLI v0.1.2 fix [11]: run clippy on every OS so the platform-specific
  # path / hook / icacls code (cfg!(target_os = ...) blocks) is actually
  # compiled + linted on every PR — not just on Linux where those arms are
  # `#[cfg]`'d out and never seen.
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

  # CLI v0.1.2 fix [11]: test on every OS so platform-gated behavior
  # (Windows path joins, Unix permission bits, etc.) is exercised per PR.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: cargo test
        run: cargo test --all-targets --locked --verbose

  # CLI v0.1.2 fix [12]: advisory + license + bans gate. Blocks merges that
  # pull a dependency with a known RUSTSEC advisory, a disallowed license, or
  # a banned/duplicate crate. The release publish job `needs:` the equivalent
  # gate so a known-vuln dep can never ship to crates.io.
  audit:
    name: cargo audit + deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit (RUSTSEC advisories)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo deny check (advisories + licenses + bans + sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
