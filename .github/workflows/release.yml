# Release pipeline for the `erebyx` CLI crate (public OSS carve-out).
#
# Trigger: pushing a version tag of the form `vX.Y.Z` (e.g. `v0.1.1`), or a
# manual `workflow_dispatch`. The git tag is the single source of truth for a
# release — there is no "publish on merge" path, so a publish only ever happens
# when an operator deliberately tags + pushes (and the crates.io token is set).
#
# Jobs:
#   1. publish-crate  (MUST-HAVE) — publishes `erebyx` to crates.io.
#                                    Fail-closed: a dry-run + a tag/version
#                                    guard gate the real `cargo publish`.
#   2. release-binaries (NICE-TO-HAVE) — cross-compiles linux/macos/windows
#                                    release binaries and attaches them to the
#                                    GitHub Release for the tag.
#
# Required repo secret:
#   CARGO_REGISTRY_TOKEN — a crates.io API token scoped to publish `erebyx`.
#                          Provisioned by an operator; absent in forks/PRs, so
#                          this workflow never runs there.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the publish job in dry-run-only mode (no upload to crates.io)."
        type: boolean
        required: false
        default: true

# A tag publish is a one-shot, irreversible operation (crates.io versions are
# immutable). Never let two release runs for the same ref overlap, and never
# cancel a publish midway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release + upload binary assets

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # MUST-HAVE: publish the crate to crates.io.
  # ---------------------------------------------------------------------------
  publish-crate:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (at the tagged commit)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # Guard: refuse to publish if the git tag and the Cargo.toml version
      # disagree. crates.io versions are immutable — a mistagged push must fail
      # loudly here, never silently publish the wrong number. Skipped for
      # manual dispatch (no tag to compare against).
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag version   = ${tag_version}"
          echo "crate version = ${crate_version}"
          if [ "${tag_version}" != "${crate_version}" ]; then
            echo "::error::Git tag v${tag_version} does not match Cargo.toml version ${crate_version}." >&2
            exit 1
          fi

      # Fail-closed pre-flight: build + package the crate exactly as it would be
      # uploaded. If this can't compile from the packaged tarball, we never
      # reach the real publish.
      - name: cargo publish --dry-run (pre-flight)
        run: cargo publish --dry-run --locked --verbose

      # The real publish. Runs only on a `v*` tag, OR on a manual dispatch with
      # dry_run explicitly set to false. The crates.io token gates it: absent =>
      # `cargo publish` fails, which is the intended fail-closed behavior.
      - name: cargo publish (crates.io)
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --verbose

  # ---------------------------------------------------------------------------
  # NICE-TO-HAVE: cross-platform release binaries attached to the GitHub Release.
  # Source install (`cargo install erebyx`) is the supported path; these are a
  # convenience for users who want a prebuilt binary. Only runs on a real tag.
  # ---------------------------------------------------------------------------
  release-binaries:
    name: build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-crate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: erebyx
            asset: erebyx-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: erebyx
            asset: erebyx-aarch64-apple-darwin.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: erebyx
            asset: erebyx-x86_64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: erebyx.exe
            asset: erebyx-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (at the tagged commit)
        uses: actions/checkout@v4

      - name: Install Rust toolchain + target (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-rel-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rel-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release --locked --verbose --target ${{ matrix.target }}

      - name: Package artifact (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          staging="erebyx-${{ matrix.target }}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${staging}/"
          cp README.md LICENSE-MIT LICENSE-APACHE-2.0 NOTICE "${staging}/"
          tar -czf "${{ matrix.asset }}" "${staging}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Package artifact (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $staging = "erebyx-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" $staging
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE-2.0, NOTICE $staging
          Compress-Archive -Path $staging -DestinationPath "${{ matrix.asset }}"
          (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLower() + "  ${{ matrix.asset }}" `
            | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
