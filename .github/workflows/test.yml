# Cross-platform build + test matrix.
#
# Closes LANE_CLI P1-8 (brutal-review: "Zero tests, no CI build matrix,
# never verified on Linux or Windows"). Before this workflow the CLI
# was developer-tested only on macOS. README.md claims macOS arm64/x64,
# Linux arm64/x64, Windows x64 — this matrix proves the binary builds
# and the test suite passes on each.
#
# Rust toolchain pinned to `stable`. MSRV is 1.75 per Cargo.toml; we
# don't currently gate against MSRV because clap 4 + reqwest 0.12 +
# tokio 1 all require recent stables, and the launch surface is "any
# stable that builds." A separate MSRV-pinning job can land in v0.1.2
# once the launch sprint settles.

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }} / rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build (release)
        run: cargo build --release --verbose

      - name: cargo test
        run: cargo test --verbose

      - name: cargo --help smoke test
        # Integration smoke per audit CC-1 / CC-4 recommendation:
        # confirm the binary actually starts and emits usage. Catches
        # link errors that don't surface in `cargo build`.
        run: cargo run --release -- --help

  lint:
    name: clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: clippy with -D warnings
        # The launch sprint's quality bar — any clippy warning becomes
        # a CI failure. Lift to `-W clippy::pedantic` post-launch.
        run: cargo clippy --all-targets --all-features -- -D warnings
